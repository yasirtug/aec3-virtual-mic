<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>AEC3 Virtual Microphone</title>
  <desc>A hand-drawn monochrome pixel microphone inspired by Windows 1.0 utility icons.</desc>
  <!-- White silhouette keeps the black pixel outline legible on dark desktops. -->
  <g fill="#ffffff">
    <rect x="6" y="0" width="4" height="1"/>
    <rect x="5" y="1" width="6" height="1"/>
    <rect x="4" y="2" width="8" height="10"/>
    <rect x="2" y="6" width="3" height="5"/>
    <rect x="11" y="6" width="3" height="5"/>
    <rect x="3" y="11" width="10" height="1"/>
    <rect x="4" y="12" width="8" height="1"/>
    <rect x="4" y="13" width="8" height="3"/>
  </g>
  <g fill="#000000">
    <rect x="6" y="1" width="4" height="1"/>
    <rect x="5" y="2" width="6" height="7"/>
    <rect x="6" y="9" width="4" height="1"/>
    <rect x="3" y="6" width="1" height="5"/>
    <rect x="12" y="6" width="1" height="5"/>
    <rect x="4" y="11" width="1" height="1"/>
    <rect x="11" y="11" width="1" height="1"/>
    <rect x="5" y="12" width="6" height="1"/>
    <rect x="7" y="13" width="2" height="1"/>
    <rect x="5" y="14" width="6" height="1"/>
  </g>
  <rect fill="#ffffff" x="6" y="2" width="4" height="7"/>
  <g fill="#000000">
    <rect x="7" y="3" width="3" height="1"/>
    <rect x="7" y="5" width="3" height="1"/>
    <rect x="7" y="7" width="3" height="1"/>
  </g>
</svg>
